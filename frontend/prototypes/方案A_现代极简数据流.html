<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PenScope · 方案A 现代极简数据流（原型）</title>
<style>
/* ============================================================
   设计系统：Modern Minimalist Data-Flow
   参考 Linear / Notion / Vercel：大量留白、内容优先、克制动效
   ============================================================ */
:root{
  /* 中性灰阶（极简底色） */
  --bg:#0a0a0b;                 /* 画布近黑 */
  --surface:#111113;            /* 一级表面 */
  --surface-2:#17171a;          /* 二级表面（行 hover / 输入） */
  --surface-3:#1d1d21;          /* 三级表面（表头） */
  --border:#242428;             /* 极弱分隔线 */
  --border-strong:#33333a;
  --text:#ededf0;               /* 主文本 */
  --text-2:#a1a1aa;             /* 次级文本 */
  --text-3:#6b6b75;             /* 占位/弱化 */

  /* 单一强调色：靛蓝（数据流主轴） */
  --accent:#6366f1;
  --accent-soft:rgba(99,102,241,.14);
  --accent-press:#4f46e5;

  /* 语义色（克制使用，仅状态） */
  --crit:#ef4444; --high:#f97316; --med:#eab308; --low:#22c55e; --info:#3b82f6;
  --crit-soft:rgba(239,68,68,.14); --high-soft:rgba(249,115,22,.14);
  --med-soft:rgba(234,179,8,.14);   --low-soft:rgba(34,197,94,.14);
  --warn:#f59e0b; --warn-soft:rgba(245,158,11,.14);

  /* 间距系统：4 的倍数 */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;

  /* 圆角 */
  --r-sm:6px; --r:8px; --r-lg:12px; --r-pill:999px;

  /* 阴影：极轻 elevation */
  --sh-1:0 1px 2px rgba(0,0,0,.28);
  --sh-2:0 4px 14px rgba(0,0,0,.36);
  --sh-3:0 12px 40px rgba(0,0,0,.5);

  /* 动效：短促、ease-out，仅 translate/opacity */
  --ease:cubic-bezier(.16,1,.3,1);
  --dur:160ms;

  /* 布局尺寸 */
  --side-w:224px;
  --side-w-collapsed:56px;
  --topbar-h:52px;
  --ctx-w:420px;
  --font-mono:ui-monospace,'SF Mono','JetBrains Mono',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
::selection{background:var(--accent-soft)}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--font-mono);font-size:12.5px}
.muted{color:var(--text-2)}
.dim{color:var(--text-3)}

/* ============================================================
   主框架：细侧栏 + 顶栏 + 内容 + 右侧上下文面板
   ============================================================ */
.app{display:grid;grid-template-columns:var(--side-w) 1fr;grid-template-rows:var(--topbar-h) 1fr;height:100vh;transition:grid-template-column var(--dur) var(--ease)}
.app.collapsed{grid-template-columns:var(--side-w-collapsed) 1fr}

/* ---------- 侧边导航 ---------- */
.sidebar{grid-row:1 / span 2;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;height:var(--topbar-h);padding:0 var(--sp-4);border-bottom:1px solid var(--border);font-weight:650;font-size:15px;white-space:nowrap}
.brand .logo{width:24px;height:24px;flex-shrink:0;display:grid;place-items:center;border-radius:6px;background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;font-size:13px}
.brand .ver{font-size:10px;color:var(--text-3);font-weight:500;margin-left:auto;padding:2px 6px;border:1px solid var(--border);border-radius:var(--r-pill)}
.app.collapsed .brand .label,.app.collapsed .brand .ver{display:none}

.nav{flex:1;padding:var(--sp-3) var(--sp-2);display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-section{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;padding:var(--sp-4) var(--sp-3) var(--sp-1);white-space:nowrap}
.app.collapsed .nav-section{opacity:0;height:6px;padding:0;overflow:hidden}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px var(--sp-3);border-radius:var(--r-sm);color:var(--text-2);font-size:13.5px;white-space:nowrap;transition:background var(--dur),color var(--dur);position:relative}
.nav-item .ic{width:18px;height:18px;flex-shrink:0;display:grid;place-items:center;opacity:.9}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--text)}
.nav-item.active .ic{color:var(--accent)}
.nav-item .count{margin-left:auto;font-size:11px;color:var(--text-3);background:var(--surface-3);padding:1px 7px;border-radius:var(--r-pill);font-weight:600}
.nav-item.active .count{background:var(--accent);color:#fff}
.app.collapsed .nav-item .label,.app.collapsed .nav-item .count{display:none}
.app.collapsed .nav-item{justify-content:center;padding:9px 0}

.side-foot{padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--border);font-size:11.5px;color:var(--text-3);white-space:nowrap}
.side-foot .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--low);margin-right:6px;vertical-align:1px}
.app.collapsed .side-foot .ft-text{display:none}
.app.collapsed .side-foot{text-align:center}

/* ---------- 顶栏 ---------- */
.topbar{grid-column:2;grid-row:1;display:flex;align-items:center;gap:var(--sp-4);padding:0 var(--sp-5);border-bottom:1px solid var(--border);background:var(--bg);min-width:0}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.crumbs .crumb{color:var(--text-2);white-space:nowrap}
.crumbs .crumb.cur{color:var(--text);font-weight:600}
.crumbs .sep{color:var(--text-3)}
.topbar .spacer{flex:1}
.cmd-trigger{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 10px 6px 12px;color:var(--text-3);font-size:13px;min-width:280px;transition:border-color var(--dur),background var(--dur)}
.cmd-trigger:hover{border-color:var(--border-strong);background:var(--surface-2)}
.cmd-trigger .kbd{margin-left:auto;font-family:var(--font-mono);font-size:11px;background:var(--surface-3);border:1px solid var(--border);padding:1px 6px;border-radius:4px;color:var(--text-2)}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border:1px solid transparent;border-radius:var(--r-sm);color:var(--text-2);background:transparent}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:1px solid transparent;border-radius:var(--r-sm);padding:7px 14px;font-size:13px;font-weight:500;transition:background var(--dur),transform var(--dur)}
.btn:hover{background:var(--accent-press)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--border-strong)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 10px;font-size:12.5px}

/* ---------- 内容区 ---------- */
.content{grid-column:2;grid-row:2;overflow-y:auto;padding:var(--sp-6) var(--sp-6) var(--sp-8);position:relative}
.content.has-ctx{padding-right:calc(var(--ctx-w) + var(--sp-5))}
.content-inner{max-width:1280px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-5);margin-bottom:var(--sp-6)}
.page-title{font-size:24px;font-weight:650;letter-spacing:-.01em;margin:0}
.page-sub{color:var(--text-2);font-size:13.5px;margin-top:4px}
.page-actions{display:flex;gap:var(--sp-2)}

/* ---------- 卡片 ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.card+.card{margin-top:var(--sp-4)}
.card-pad{padding:var(--sp-5)}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border)}
.card-head h2{margin:0;font-size:14px;font-weight:600}
.card-head .sub{font-size:12px;color:var(--text-3)}

/* ---------- 统计卡片（仪表盘） ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-3);margin-bottom:var(--sp-5)}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--sp-4) var(--sp-5);position:relative;overflow:hidden}
.kpi .lbl{font-size:12px;color:var(--text-3);font-weight:500}
.kpi .val{font-size:30px;font-weight:650;letter-spacing:-.02em;margin-top:6px;line-height:1}
.kpi .delta{font-size:11.5px;margin-top:8px;color:var(--text-2);display:flex;align-items:center;gap:4px}
.kpi .delta.up{color:var(--low)} .kpi .delta.down{color:var(--crit)}
.kpi .spark{position:absolute;right:var(--sp-4);bottom:var(--sp-4);opacity:.5}

/* ---------- 列表 / 表格 ---------- */
.list{display:flex;flex-direction:column}
.list-row{display:grid;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-5);border-bottom:1px solid var(--border);transition:background var(--dur);cursor:pointer;grid-template-columns:var(--row-cols,auto)}
.list-row:last-child{border-bottom:none}
.list-row:hover{background:var(--surface-2)}
.list-row.expanded{background:var(--surface-2)}
.list-head{display:grid;gap:var(--sp-3);padding:var(--sp-3) var(--sp-5);border-bottom:1px solid var(--border);background:var(--surface-3);font-size:11.5px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;grid-template-columns:var(--row-cols,auto)}
.cell-main{min-width:0}
.cell-main .t1{font-size:13.5px;font-weight:550;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-main .t2{font-size:12px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-sub{font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}

/* 渐进式展开 */
.expand-body{grid-column:1 / -1;padding:var(--sp-4) var(--sp-5) var(--sp-5);border-top:1px solid var(--border);background:var(--bg);display:none}
.list-row.expanded .expand-body{display:block;animation:fadeIn var(--dur) var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ---------- 徽标 / 标签 ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;line-height:1.5;white-space:nowrap}
.badge.crit{background:var(--crit-soft);color:var(--crit)}
.badge.high{background:var(--high-soft);color:var(--high)}
.badge.med{background:var(--med-soft);color:var(--med)}
.badge.low{background:var(--low-soft);color:var(--low)}
.badge.info{background:rgba(59,130,246,.14);color:var(--info)}
.badge.neutral{background:var(--surface-3);color:var(--text-2)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border:1px solid var(--border);border-radius:var(--r-pill);font-size:11.5px;color:var(--text-2);background:var(--surface);cursor:pointer;transition:all var(--dur)}
.chip:hover{border-color:var(--border-strong);color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .cnt{font-size:10.5px;opacity:.7}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500}
.status-pill .ring{width:8px;height:8px;border-radius:50%}
.s-running .ring{background:var(--info);box-shadow:0 0 0 3px rgba(59,130,246,.18);animation:pulse 1.6s infinite}
.s-done .ring{background:var(--low)} .s-paused .ring{background:var(--warn)} .s-failed .ring{background:var(--crit)} .s-queued .ring{background:var(--text-3)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(59,130,246,0)}}

/* ---------- 筛选条 ---------- */
.filterbar{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-4)}
.filterbar .seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:2px}
.filterbar .seg button{background:transparent;border:none;color:var(--text-2);padding:5px 11px;font-size:12.5px;border-radius:4px}
.filterbar .seg button.on{background:var(--surface-3);color:var(--text)}
.search-input{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 11px;font-size:13px;color:var(--text);width:220px;transition:border-color var(--dur)}
.search-input:focus{outline:none;border-color:var(--accent)}
.search-input::placeholder{color:var(--text-3)}

/* ---------- 甘特图（SVG） ---------- */
.gantt{width:100%}
.gantt .track{fill:var(--surface-2)}
.gantt .bar{rx:3;transition:opacity var(--dur)}
.gantt .bar:hover{opacity:.85}
.gantt .bar-label{fill:var(--text);font-size:11px;font-weight:500;dominant-baseline:central}
.gantt .axis{stroke:var(--border);stroke-width:1}
.gantt .axis-text{fill:var(--text-3);font-size:10.5px}
.gantt .now{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3}

/* ---------- 拓扑缩略图 ---------- */
.topo-mini{width:100%;height:240px;display:block}
.topo-mini .edge{stroke:var(--border-strong);stroke-width:1}
.topo-mini .edge.chain{stroke:var(--crit);stroke-width:1.5;stroke-dasharray:4 3;opacity:.7}
.topo-mini .node{cursor:pointer}
.topo-mini .node circle{transition:filter var(--dur)}
.topo-mini .node:hover circle{filter:drop-shadow(0 0 4px rgba(99,102,241,.6))}
.topo-mini .nlabel{fill:var(--text-2);font-size:9.5px;text-anchor:middle;pointer-events:none}

/* ---------- 右侧上下文面板（替代弹窗） ---------- */
.ctx-panel{position:absolute;top:0;right:0;bottom:0;width:var(--ctx-w);background:var(--surface);border-left:1px solid var(--border);transform:translateX(100%);transition:transform var(--dur) var(--ease);overflow-y:auto;z-index:5;box-shadow:var(--sh-3)}
.ctx-panel.open{transform:translateX(0)}
.ctx-head{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border);z-index:2}
.ctx-head .ctx-title{font-size:15px;font-weight:600;flex:1;min-width:0}
.ctx-body{padding:var(--sp-5)}
.ctx-section{margin-bottom:var(--sp-5)}
.ctx-section h3{font-size:11.5px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin:0 0 var(--sp-3)}
.kv-row{display:grid;grid-template-columns:96px 1fr;gap:var(--sp-3);padding:7px 0;font-size:13px;border-bottom:1px solid var(--border)}
.kv-row:last-child{border-bottom:none}
.kv-row .k{color:var(--text-3)}
.kv-row .v{color:var(--text)}
.code-block{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:var(--sp-3);font-family:var(--font-mono);font-size:12px;line-height:1.6;color:var(--text-2);white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto}
.code-block .add{color:var(--low)} .code-block .del{color:var(--crit)} .code-block mark{background:var(--med-soft);color:var(--med);padding:0 2px;border-radius:2px}
.cvss-bar{height:8px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden;margin-top:6px}
.cvss-bar>i{display:block;height:100%;border-radius:var(--r-pill)}
.cvss-num{font-size:40px;font-weight:700;line-height:1;letter-spacing:-.02em}

/* ---------- 命令面板 ---------- */
.cmd-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding-top:14vh;z-index:100;animation:fadeIn var(--dur) var(--ease)}
.cmd-overlay.open{display:flex}
.cmd-palette{width:min(560px,92vw);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-lg);box-shadow:var(--sh-3);overflow:hidden}
.cmd-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);padding:var(--sp-4) var(--sp-5);color:var(--text);font-size:15px}
.cmd-input:focus{outline:none}
.cmd-list{max-height:360px;overflow-y:auto;padding:var(--sp-2)}
.cmd-group{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;padding:var(--sp-2) var(--sp-3) var(--sp-1)}
.cmd-item{display:flex;align-items:center;gap:var(--sp-3);padding:9px var(--sp-3);border-radius:var(--r-sm);color:var(--text);font-size:13.5px}
.cmd-item.active,.cmd-item:hover{background:var(--accent-soft)}
.cmd-item .ic{width:18px;height:18px;color:var(--text-3);display:grid;place-items:center}
.cmd-item.active .ic{color:var(--accent)}
.cmd-item .hint{margin-left:auto;font-size:11px;color:var(--text-3)}

/* ---------- Toast ---------- */
.toast{position:fixed;bottom:var(--sp-5);left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--border-strong);border-radius:var(--r);padding:10px var(--sp-4);font-size:13px;box-shadow:var(--sh-2);z-index:200;display:none;align-items:center;gap:var(--sp-3)}
.toast.show{display:flex;animation:fadeIn var(--dur) var(--ease)}

/* ---------- 漏洞矩阵小图 ---------- */
.mini-matrix{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.mini-matrix .mc{height:18px;border-radius:3px;font-size:9px;display:grid;place-items:center;color:#0a0a0b;font-weight:700}

/* ---------- 滚动条 ---------- */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:var(--r-pill);border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

/* ---------- 响应式 ---------- */
@media (max-width:1024px){
  :root{--ctx-w:380px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:768px){
  .app{grid-template-columns:var(--side-w-collapsed) 1fr}
  .app .nav-item .label,.app .brand .label,.app .nav-section,.app .side-foot .ft-text{display:none}
  .content.has-ctx{padding-right:var(--sp-6)}
  .ctx-panel{width:100%}
  .cmd-trigger{min-width:0}
}

/* 工具类 */
.row{display:flex;gap:var(--sp-2);align-items:center}
.row.wrap{flex-wrap:wrap}
.gap-3{gap:var(--sp-3)} .gap-4{gap:var(--sp-4)}
.mt-2{margin-top:var(--sp-2)} .mt-4{margin-top:var(--sp-4)} .mt-5{margin-top:var(--sp-5)}
.hidden{display:none !important}
.tag-divider{width:1px;height:16px;background:var(--border);margin:0 var(--sp-1)}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ============ 侧边导航 ============ -->
  <aside class="sidebar">
    <div class="brand">
      <span class="logo">A</span>
      <span class="label">PenScope<span style="color:var(--accent)">AI</span></span>
      <span class="ver">v2.0</span>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-section">工作区</div>
      <a class="nav-item active" data-view="dashboard"><span class="ic">▣</span><span class="label">仪表盘</span></a>
      <a class="nav-item" data-view="targets"><span class="ic">◎</span><span class="label">授权目标</span><span class="count">12</span></a>
      <a class="nav-item" data-view="scans"><span class="ic">▶</span><span class="label">扫描任务</span><span class="count">3</span></a>
      <a class="nav-item" data-view="reviews"><span class="ic">◈</span><span class="label">复核闸门</span><span class="count" style="background:var(--warn);color:#1a1a1a">2</span></a>
      <div class="nav-section">洞察</div>
      <a class="nav-item" data-view="topology"><span class="ic">⌬</span><span class="label">资产拓扑</span></a>
      <a class="nav-item" data-view="audit"><span class="ic">≡</span><span class="label">审计日志</span></a>
      <div class="nav-section">系统</div>
      <a class="nav-item" data-view="scheduler"><span class="ic">◷</span><span class="label">定时 / 批量</span></a>

/* ---------- 拓扑 SVG（缩略 / 全景） ---------- */
function topoMiniSVG(){
  // 简化力导向布局节点
  var nodes = [
    {x:60,y:50,r:8,type:"target",label:"192.168.1.10",risk:"High"},
    {x:140,y:30,r:6,type:"host",label:":22"},
    {x:150,y:80,r:6,type:"host",label:":80"},
    {x:200,y:55,r:5,type:"finding",label:"SQLi",risk:"Critical"},
    {x:90,y:120,r:7,type:"target",label:"vpn.gw",risk:"Critical"},
    {x:170,y:140,r:5,type:"finding",label:"证书",risk:"High"}
  ];
  var edges = [[0,1],[0,2],[2,3],[0,4,"chain"],[4,5,"chain"]];
  var ns = nodes.map(function(n,i){
    var fill = n.type==="target"?"var(--accent)":n.type==="host"?"var(--surface-3)":"var(--crit)";
    return '<g class="node"><circle cx="'+n.x+'" cy="'+n.y+'" r="'+n.r+'" fill="'+fill+'" stroke="var(--bg)" stroke-width="2"/><text class="nlabel" x="'+n.x+'" y="'+(n.y+n.r+9)+'">'+n.label+'</text></g>';
  }).join("");
  var es = edges.map(function(e){
    var a=nodes[e[0]],b=nodes[e[1]];
    return '<line class="edge'+(e[2]?" chain":"")+'" x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'"/>';
  }).join("");
  return '<svg class="topo-mini" viewBox="0 0 240 170">'+es+ns+'</svg>';
}

/* ---------- 甘特图 SVG ---------- */
function renderGanttSVG(stages){
  var W=380, rowH=22, pad=8, labelW=84;
  var total = stages[stages.length-1].end;
  var H = stages.length*rowH + 22;
  var barX = function(s){return labelW + (s.start/total)*(W-labelW-2*pad);};
  var barW = function(s){return Math.max(4,( (s.end-s.start)/total)*(W-labelW-2*pad));};
  var colors = {done:"var(--low)",running:"var(--info)",paused:"var(--warn)",failed:"var(--crit)",pending:"var(--surface-3)"};
  var rows = stages.map(function(s,i){
    var y = 18 + i*rowH;
    return '<text x="'+pad+'" y="'+(y+rowH/2+3)+'" style="fill:var(--text-2);font-size:10.5px">'+s.name+'</text>'+
      '<rect class="track" x="'+labelW+'" y="'+(y+3)+'" width="'+(W-labelW-pad)+'" height="'+(rowH-8)+'" rx="3"/>'+
      '<rect class="bar" x="'+barX(s)+'" y="'+(y+3)+'" width="'+barW(s)+'" height="'+(rowH-8)+'" fill="'+(colors[s.status]||"var(--text-3)")+'"/>';
  }).join("");
  // now line (running 阶段进度)
  var running = stages.filter(function(s){return s.status==="running";})[0];
  var nowX = running ? barX(running)+barW(running)*0.5 : W-pad;
  return '<svg class="gantt" viewBox="0 0 '+W+' '+H+'" style="width:100%">'+rows+
    '<line class="now" x1="'+nowX+'" y1="14" x2="'+nowX+'" y2="'+(H-4)+'"/>'+
    '<text class="axis-text" x="'+nowX+'" y="10" text-anchor="middle">现在</text></svg>';
}

var cmdItems = [
  {group:"导航",ic:"→",label:"跳转 仪表盘",hint:"G D",act:function(){navigate("dashboard");}},
  {group:"导航",ic:"→",label:"跳转 授权目标",hint:"G T",act:function(){navigate("targets");}},

  {group:"导航",ic:"→",label:"跳转 资产拓扑",hint:"G O",act:function(){navigate("topology");}},
  {group:"操作",ic:"＋",label:"新建扫描",hint:"N",act:function(){toast("新建扫描（原型演示）");}},
  {group:"操作",ic:"＋",label:"新增授权目标",hint:"T",act:function(){navigate("targets");}},

  {group:"搜索",ic:"⌕",label:"目标 192.168.1.10",hint:"",act:function(){navigate("targets");}},
  {group:"搜索",ic:"⌕",label:"扫描 #101 内网资产季度巡检",hint:"",act:function(){navigate("scans");}},
  {group:"搜索",ic:"⌕",label:"漏洞 SQL 注入 (CWE-89)",hint:"",act:function(){toast("已定位漏洞（原型演示）");}},
  {group:"设置",ic:"⚙",label:"切换主题",hint:"",act:function(){toast("已切换主题（原型演示）");}},
  {group:"设置",ic:"⚙",label:"设置",hint:"G ,",act:function(){navigate("settings");}}
];
var cmdActive = 0;
function renderCmdList(filter){
  filter = (filter||"").toLowerCase();
  var html = "", lastGroup = "", hits = [];
  cmdItems.forEach(function(it){
    if(it.label.toLowerCase().indexOf(filter)>=0) hits.push(it);
  });
  if(!hits.length){document.getElementById("cmd-list").innerHTML='<div style="padding:24px;text-align:center;color:var(--text-3)">无匹配结果</div>';return;}
  cmdActive = 0;
  hits.forEach(function(it,i){
    if(it.group!==lastGroup){html+='<div class="cmd-group">'+it.group+'</div>';lastGroup=it.group;}
    html+='<div class="cmd-item'+(i===0?" active":"")+'"><span class="ic">'+it.ic+'</span><span>'+it.label+'</span>'+(it.hint?'<span class="hint">'+it.hint+'</span>':'')+'</div>';
  });
  document.getElementById("cmd-list").innerHTML = html;
  document.querySelectorAll(".cmd-item").forEach(function(el,i){
    el.addEventListener("click", function(){hits[i].act();closeCmd();});
    el.addEventListener("mouseenter", function(){
      document.querySelectorAll(".cmd-item").forEach(function(x){x.classList.remove("active");});
      el.classList.add("active"); cmdActive = i;
    });
  });
  cmdHits = hits;
}
var cmdHits = [];
function openCmd(){document.getElementById("cmd-overlay").classList.add("open");setTimeout(function(){document.getElementById("cmd-input").focus();},0);renderCmdList("");}
function closeCmd(){document.getElementById("cmd-overlay").classList.remove("open");document.getElementById("cmd-input").value="";}
document.getElementById("open-cmd").addEventListener("click", openCmd);
document.getElementById("cmd-overlay").addEventListener("click", function(e){if(e.target===this)closeCmd();});
document.getElementById("cmd-input").addEventListener("input", function(){renderCmdList(this.value);});
document.getElementById("cmd-input").addEventListener("keydown", function(e){
  var items = document.querySelectorAll(".cmd-item");
  if(e.key==="ArrowDown"){e.preventDefault();cmdActive=Math.min(cmdActive+1,items.length-1);items.forEach(function(x,i){x.classList.toggle("active",i===cmdActive);});items[cmdActive].scrollIntoView({block:"nearest"});}
  else if(e.key==="ArrowUp"){e.preventDefault();cmdActive=Math.max(cmdActive-1,0);items.forEach(function(x,i){x.classList.toggle("active",i===cmdActive);});items[cmdActive].scrollIntoView({block:"nearest"});}
  else if(e.key==="Enter"){e.preventDefault();if(cmdHits[cmdActive]){cmdHits[cmdActive].act();closeCmd();}}
  else if(e.key==="Escape"){closeCmd();}
});

/* ============================================================
   全局快捷键
   ============================================================ */
document.addEventListener("keydown", function(e){
  // Cmd/Ctrl + K 命令面板
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){e.preventDefault();openCmd();}
  // Esc 关闭上下文面板
  if(e.key==="Escape"){closeCmd();closeCtx();}
  // G 前缀跳转
  if(e.key==="g" && !e.target.matches("input,textarea,select")){
    var handler = function(e2){
      document.removeEventListener("keydown", handler);
      var map = {d:"dashboard",t:"targets",s:"scans",r:"reviews",o:"topology"};
      if(map[e2.key]) navigate(map[e2.key]);
    };
    document.addEventListener("keydown", handler);
    setTimeout(function(){document.removeEventListener("keydown", handler);}, 800);
  }
});
