# PenScope —— 自动发布工作流
# 触发：推送 main / 推送 v* 标签 / 手动 workflow_dispatch
# 行为：构建 dist/PenScope.exe，并作为 GitHub Release 资产发布（仓库公开后即为公开下载）。
name: Release PenScope

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "覆盖版本号（留空则读取 config.py 的 VERSION）"
        required: false

permissions:
  contents: write   # 创建 Release 与标签所需

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate icon/tray assets
        run: python make_icon.py

      - name: Build executable
        run: python build_nowrap.py

      - name: Read VERSION
        id: ver
        shell: bash
        run: |
          VER=$(python -c "import re;print(re.search(r'VERSION\s*=\s*\"(\d+\.\d+\.\d+)\"', open('config.py').read()).group(1))")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        run: python tools/release.py notes > .release_notes.md

      - name: Check if release already exists
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (attach exe)
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PenScope ${{ steps.ver.outputs.tag }}
          body_path: .release_notes.md
          files: dist/PenScope.exe
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
