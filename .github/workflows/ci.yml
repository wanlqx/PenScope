# PenScope —— CI 测试 / 代码质量 / 安全扫描
# 触发：推送到 master/main、针对 master/main 的 PR
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: 测试 (pytest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # 仅运行无需显示/网络的纯逻辑测试，保证 CI 稳定通过；
        # 其余涉及 GUI / 靶机的测试请在本机手动运行（见 CONTRIBUTING.md）。
        run: python -m pytest tests/test_session_vault.py tests/test_hardening.py tests/test_cred_dict.py tests/smoke_nobackend.py tests/test_scope_redirect.py tests/test_vuln_i18n.py -q

  quality:
    name: 代码质量与安全扫描
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit

      - name: Ruff lint
        run: ruff check . || true

      - name: Bandit security scan
        run: bandit -r scanner app_api.py -ll || true

      - name: pip-audit dependency scan
        run: pip-audit -r requirements.txt || true
